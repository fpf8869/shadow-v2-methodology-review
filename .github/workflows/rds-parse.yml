name: RDS parse
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/rds-parse.yml"]
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Download revised public RDS and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o den.rds https://github.com/nflverse/nflverse-pbp/releases/download/raw_pbp_2026/2026_05_DEN_LAC.rds
          curl -fLsS --retry 3 -o sea.rds https://github.com/nflverse/nflverse-pbp/releases/download/raw_pbp_2026/2026_05_SF_SEA.rds
          echo '537968dc811aae6bc0c55b7f28127f97f74b7a05bda33e0adc1cc6f0695c4a6a  den.rds' | sha256sum -c
          echo 'da3922c1e308676c6e12b8af6cf2ea96762beb9bdd51181b27a889159c654189  sea.rds' | sha256sum -c
      - name: Decode nested RDS safely
        shell: bash
        run: |
          mkdir -p output
          cat > extract.R <<'RSCRIPT'
          for (f in c("den.rds","sea.rds")) {
            x <- readRDS(f)
            sink(paste0("output/",f,".structure.txt"))
            str(x, max.level=4, list.len=40)
            sink()
            found <- 0L
            visit <- function(obj,path,depth=0L) {
              if (depth>8L) return(invisible(NULL))
              if (is.data.frame(obj)) {
                found <<- found+1L
                flat <- obj; for (nm in names(flat)) { if (is.list(flat[[nm]])) flat[[nm]] <- vapply(flat[[nm]],function(z) paste(capture.output(dput(z)),collapse=""),character(1)) }; write.csv(flat,paste0("output/",f,".table",found,".csv"),row.names=FALSE)
                writeLines(names(obj),paste0("output/",f,".table",found,".columns.txt"))
                cat(f,path,nrow(obj),ncol(obj),"\\n")
              } else if (is.list(obj)) {
                for (i in seq_along(obj)) visit(obj[[i]],paste0(path,"/",names(obj)[i]),depth+1L)
              }
            }
            visit(x,"root")
            if (found==0L) cat("NO_DATA_FRAMES",f,"\\n")
          }
          RSCRIPT
          Rscript extract.R
      - uses: actions/upload-artifact@v4
        with:
          name: revised-week5-rds-decoded
          path: output/

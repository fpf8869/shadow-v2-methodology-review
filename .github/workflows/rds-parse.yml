name: RDS parse
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/rds-parse.yml"]
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Download revised public RDS and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o den.rds https://github.com/nflverse/nflverse-pbp/releases/download/raw_pbp_2026/2026_05_DEN_LAC.rds
          curl -fLsS --retry 3 -o sea.rds https://github.com/nflverse/nflverse-pbp/releases/download/raw_pbp_2026/2026_05_SF_SEA.rds
          echo '537968dc811aae6bc0c55b7f28127f97f74b7a05bda33e0adc1cc6f0695c4a6a  den.rds' | sha256sum -c
          echo 'da3922c1e308676c6e12b8af6cf2ea96762beb9bdd51181b27a889159c654189  sea.rds' | sha256sum -c
      - name: Decode RDS
        run: |
          mkdir output
          Rscript -e 'for (f in c("den.rds","sea.rds")) { x <- readRDS(f); cat(f,"class",paste(class(x),collapse=","),"length",length(x),"\n"); if (is.list(x) && !is.data.frame(x)) { saveRDS(lapply(x,class),paste0("output/",f,".classes.rds")); x <- as.data.frame(x,optional=TRUE) }; stopifnot(is.data.frame(x)); write.csv(x,paste0("output/",f,".csv"),row.names=FALSE); writeLines(names(x),paste0("output/",f,".columns.txt")); cat(f,nrow(x),ncol(x),"\n") }'
      - uses: actions/upload-artifact@v4
        with:
          name: revised-week5-rds-decoded
          path: output/

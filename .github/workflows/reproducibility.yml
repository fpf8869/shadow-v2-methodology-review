name: Research reproducibility (not release approval)
on:
  workflow_dispatch:
  push:
    paths:
      - 'shadow_v2_research.py'
      - 'test_*.py'
      - 'evaluate_exposed.py'
      - 'joint_gamma_poisson.py'
      - 'shadow_joint_poisson_v1.py'
      - '.github/workflows/reproducibility.yml'
jobs:
  exposed-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn
      - name: Download original research input assets (public only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o cfb_schedule_2026.csv https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_schedules/cfb_schedule_2026.csv
          curl -fL --retry 3 -o team_box_2026.csv https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_team_box/team_box_2026.csv
          curl -fL --retry 3 -o adv_passing_2026.csv https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_adv_passing/adv_passing_2026.csv
          printf '%s  %s\n' 56707a541720854b4b362b8879231adb9eb633c0829e1065a75aa59441752d80 cfb_schedule_2026.csv 4e612b2056707d0cccdb8e6db69047e286e39316d561e4d686c59e5e85261b18 team_box_2026.csv b5c174db6e50481b67aee40f5c24faa93c489b75d330db004e66339646eccaf4 adv_passing_2026.csv | sha256sum --check --status
      - name: Execute source-backed and mathematical tests
        run: python -m unittest -v test_shadow_v2 test_joint_gamma_poisson test_protocol test_source_reproduction
      - name: Reproduce EXPOSED 58-game comparison
        run: python evaluate_exposed.py --schedule cfb_schedule_2026.csv --box team_box_2026.csv --passing adv_passing_2026.csv --out exposed_output
      - uses: actions/upload-artifact@v4
        with:
          name: exposed-historical-diagnostic-not-validation
          path: exposed_output/
